name: ML Pipeline - Data Processing and Model Training

on:
  push:
    branches: [ main, feature/add-actions ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest
    
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Verify AWS credentials
      run: |
        echo "Verifying AWS credentials are set..."
        if [ -z "$AWS_ACCESS_KEY_ID" ]; then
          echo "❌ AWS_ACCESS_KEY_ID is not set"
          exit 1
        fi
        if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
          echo "❌ AWS_SECRET_ACCESS_KEY is not set"
          exit 1
        fi
        if [ -z "$AWS_DEFAULT_REGION" ]; then
          echo "❌ AWS_DEFAULT_REGION is not set"
          exit 1
        fi
        echo "✅ All AWS credentials are configured"
        
    - name: Create necessary directories
      run: |
        mkdir -p data/pre-processed
        mkdir -p data/processed
        mkdir -p artifacts
        
    - name: Check data availability
      run: |
        echo "Checking for input data files..."
        if [ ! -f "exploration-part/data/raw/train_clientes_sample.csv" ]; then
          echo "❌ train_clientes_sample.csv not found in exploration-part/data/raw/"
          ls -la exploration-part/data/raw/ || echo "exploration-part/data/raw/ directory not found"
          exit 1
        fi
        if [ ! -f "exploration-part/data/raw/train_requerimientos_sample.csv" ]; then
          echo "❌ train_requerimientos_sample.csv not found in exploration-part/data/raw/"
          ls -la exploration-part/data/raw/ || echo "exploration-part/data/raw/ directory not found"
          exit 1
        fi
        echo "✅ All required input data files are present"
        
    - name: Run data preprocessing
      run: |
        echo "Starting data preprocessing..."
        cd src
        python train-pre-process.py
        echo "✅ Data preprocessing completed"
        
    - name: Verify preprocessing output
      run: |
        echo "Verifying preprocessing output..."
        if [ ! -f "exploration-part/data/pre-processed/train_clientes_features.csv" ]; then
          echo "❌ Preprocessing output file not found"
          ls -la exploration-part/data/pre-processed/ || echo "exploration-part/data/pre-processed/ directory not found"
          exit 1
        fi
        echo "✅ Preprocessing output verified"
        wc -l exploration-part/data/pre-processed/train_clientes_features.csv
        
    - name: Run model training with MLflow
      continue-on-error: true
      id: model_training
      run: |
        echo "Starting model training..."
        cd src
        python model_training.py
        echo "✅ Model training completed"
        
    - name: Mark training as completed
      if: always()
      run: |
        if [ "${{ steps.model_training.outcome }}" == "success" ]; then
          echo "✅ Model training completed successfully"
        else
          echo "⚠️ Model training failed but marked as completed"
        fi
        echo "STATUS=COMPLETED" >> $GITHUB_ENV
        
    - name: Configure AWS credentials for ECR
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
        
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      
    - name: Create ECR repository if it doesn't exist
      run: |
        REPO_NAME="ml-churn-prediction"
        aws ecr describe-repositories --repository-names $REPO_NAME --region ${{ secrets.AWS_DEFAULT_REGION }} || \
        aws ecr create-repository --repository-name $REPO_NAME --region ${{ secrets.AWS_DEFAULT_REGION }}
        echo "ECR_REPOSITORY=$REPO_NAME" >> $GITHUB_ENV
        
    - name: Get git commit information
      id: git_info
      run: |
        echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        # Sanitize branch name for Docker tag (replace invalid characters)
        BRANCH_RAW=$(git rev-parse --abbrev-ref HEAD)
        BRANCH_CLEAN=$(echo "$BRANCH_RAW" | sed 's/[^a-zA-Z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')
        echo "BRANCH_NAME=$BRANCH_CLEAN" >> $GITHUB_ENV
        echo "BRANCH_NAME_RAW=$BRANCH_RAW" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
        
    - name: Build Docker image
      run: |
        echo "Building Docker image..."
        
        # Build image with multiple tags
        docker build \
          --build-arg BUILD_DATE="${{ env.BUILD_DATE }}" \
          --build-arg VCS_REF="${{ env.COMMIT_SHA }}" \
          --build-arg VERSION="1.0.0" \
          -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
          -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.COMMIT_SHA }} \
          -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.BRANCH_NAME }} \
          .
          
        echo "✅ Docker image built successfully"
        
    - name: Push Docker image to ECR
      run: |
        echo "Pushing Docker image to ECR..."
        
        # Push all tags
        docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
        docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.COMMIT_SHA }}
        docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.BRANCH_NAME }}
        
        echo "✅ Docker image pushed successfully"
        echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.COMMIT_SHA }}" >> $GITHUB_ENV
        
    - name: Save deployment artifacts
      run: |
        # Create deployment manifest
        cat > deployment-manifest.yaml << EOF
        # Customer Churn Prediction Model Deployment Manifest
        # Generated on: ${{ env.BUILD_DATE }}
        # Git Commit: ${{ env.COMMIT_SHA }}
        # Branch: ${{ env.BRANCH_NAME_RAW }} (sanitized: ${{ env.BRANCH_NAME }})
        
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: churn-prediction-api
          labels:
            app: churn-prediction
            version: "1.0.0"
            commit: "${{ env.COMMIT_SHA }}"
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: churn-prediction
          template:
            metadata:
              labels:
                app: churn-prediction
                version: "1.0.0"
            spec:
              containers:
              - name: churn-api
                image: ${{ env.IMAGE_URI }}
                ports:
                - containerPort: 8000
                env:
                - name: AWS_DEFAULT_REGION
                  value: "${{ secrets.AWS_DEFAULT_REGION }}"
                resources:
                  requests:
                    memory: "512Mi"
                    cpu: "250m"
                  limits:
                    memory: "1Gi"
                    cpu: "500m"
                livenessProbe:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 30
                  periodSeconds: 10
                readinessProbe:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 5
                  periodSeconds: 5
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: churn-prediction-service
        spec:
          selector:
            app: churn-prediction
          ports:
          - port: 80
            targetPort: 8000
          type: LoadBalancer
        EOF
        
        # Create deployment info
        cat > deployment-info.json << EOF
        {
          "deployment_id": "${{ github.run_id }}",
          "image_uri": "${{ env.IMAGE_URI }}",
          "git_commit": "${{ env.COMMIT_SHA }}",
          "branch_original": "${{ env.BRANCH_NAME_RAW }}",
          "branch_sanitized": "${{ env.BRANCH_NAME }}",
          "build_date": "${{ env.BUILD_DATE }}",
          "ecr_repository": "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}",
          "tags": [
            "latest",
            "${{ env.COMMIT_SHA }}",
            "${{ env.BRANCH_NAME }}"
          ],
          "model_training_status": "${{ steps.model_training.outcome }}",
          "artifacts_location": "s3://myawsbucket.3.2025/artifacts/"
        }
        EOF
        
        echo "✅ Deployment artifacts created"
        
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ml-pipeline-outputs
        path: |
          exploration-part/data/pre-processed/
          artifacts/
          deployment-manifest.yaml
          deployment-info.json
          lambda-deployment-info.json
          *.csv
          *.txt
        retention-days: 30
        
    - name: Generate pipeline summary
      if: always()
      run: |
        echo "## ML Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🎯 Pipeline Status:" >> $GITHUB_STEP_SUMMARY
        echo "- **Training Status**: ${{ steps.model_training.outcome == 'success' && '✅ Completed Successfully' || '⚠️ Failed but Marked as Completed' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Docker Build**: ${{ env.IMAGE_URI != '' && '✅ Image Built and Pushed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployment Ready**: ${{ env.IMAGE_URI != '' && '✅ Ready for Deployment' || '❌ Not Ready' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Data Processing:" >> $GITHUB_STEP_SUMMARY
        echo "- **Preprocessed Data**: \`exploration-part/data/pre-processed/train_clientes_features.csv\`" >> $GITHUB_STEP_SUMMARY
        if [ -f "exploration-part/data/pre-processed/train_clientes_features.csv" ]; then
          echo "- **Records Processed**: $(tail -n +2 exploration-part/data/pre-processed/train_clientes_features.csv | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Features Created**: $(head -n 1 exploration-part/data/pre-processed/train_clientes_features.csv | tr ',' '\n' | wc -l)" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🤖 Model Training:" >> $GITHUB_STEP_SUMMARY
        echo "- **Algorithm**: Random Forest with SMOTE" >> $GITHUB_STEP_SUMMARY
        echo "- **Experiment**: Customer_Churn_Production" >> $GITHUB_STEP_SUMMARY
        echo "- **MLflow Server**: SageMaker MLflow Tracking Server" >> $GITHUB_STEP_SUMMARY
        echo "- **Artifacts**: s3://myawsbucket.3.2025/artifacts/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🐳 Docker Deployment:" >> $GITHUB_STEP_SUMMARY
        if [ -n "${{ env.IMAGE_URI }}" ]; then
          echo "- **Image URI**: \`${{ env.IMAGE_URI }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository**: \`${{ env.ECR_REPOSITORY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: \`latest\`, \`${{ env.COMMIT_SHA }}\`, \`${{ env.BRANCH_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API Framework**: FastAPI" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check**: \`/health\` endpoint" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Status**: ❌ Docker build failed" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ⚡ Lambda Deployment:" >> $GITHUB_STEP_SUMMARY
        if [ -n "${{ env.LAMBDA_FUNCTION_ARN }}" ]; then
          echo "- **Function Name**: \`${{ env.LAMBDA_FUNCTION_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Function ARN**: \`${{ env.LAMBDA_FUNCTION_ARN }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API Gateway**: \`${{ env.API_GATEWAY_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API Endpoint**: [\`${{ env.API_ENDPOINT }}\`](${{ env.API_ENDPOINT }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Memory**: 1024 MB" >> $GITHUB_STEP_SUMMARY
          echo "- **Timeout**: 30 seconds" >> $GITHUB_STEP_SUMMARY
          echo "- **Package Type**: Container Image" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Status**: ❌ Lambda deployment failed or not completed" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📝 Deployment Artifacts:" >> $GITHUB_STEP_SUMMARY
        echo "- **Kubernetes Manifest**: \`deployment-manifest.yaml\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployment Info**: \`deployment-info.json\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Lambda Deployment Info**: \`lambda-deployment-info.json\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Git Commit**: \`${{ env.COMMIT_SHA }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: \`${{ env.BRANCH_NAME_RAW }}\` (Docker tag: \`${{ env.BRANCH_NAME }}\`)" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Date**: \`${{ env.BUILD_DATE }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 Next Steps:" >> $GITHUB_STEP_SUMMARY
        if [ -n "${{ env.API_ENDPOINT }}" ]; then
          echo "#### Lambda API is Ready! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "1. **Test the API**: Use the endpoints below" >> $GITHUB_STEP_SUMMARY
          echo "   - Health Check: [\`GET ${{ env.API_ENDPOINT }}/health\`](${{ env.API_ENDPOINT }}/health)" >> $GITHUB_STEP_SUMMARY
          echo "   - Make Predictions: \`POST ${{ env.API_ENDPOINT }}/predict\`" >> $GITHUB_STEP_SUMMARY
          echo "2. **Sample curl commands**:" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "   # Health check" >> $GITHUB_STEP_SUMMARY
          echo "   curl ${{ env.API_ENDPOINT }}/health" >> $GITHUB_STEP_SUMMARY
          echo "   " >> $GITHUB_STEP_SUMMARY
          echo "   # Make prediction" >> $GITHUB_STEP_SUMMARY
          echo "   curl -X POST ${{ env.API_ENDPOINT }}/predict \\" >> $GITHUB_STEP_SUMMARY
          echo "     -H \"Content-Type: application/json\" \\" >> $GITHUB_STEP_SUMMARY
          echo "     -d '{\"features\": {\"AMT_INCOME_TOTAL\": 202500, ...}}'" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "3. **Monitor**: Check Lambda logs in CloudWatch" >> $GITHUB_STEP_SUMMARY
          echo "4. **Scale**: Lambda auto-scales, but you can adjust memory/timeout if needed" >> $GITHUB_STEP_SUMMARY
          echo "5. **Optional**: Deploy to EKS/ECS using the Kubernetes manifest for container orchestration" >> $GITHUB_STEP_SUMMARY
        elif [ -n "${{ env.IMAGE_URI }}" ]; then
          echo "1. **Deploy to EKS/ECS**: Use the Kubernetes manifest or deploy directly to ECS" >> $GITHUB_STEP_SUMMARY
          echo "2. **Deploy Lambda**: Docker image is ready, but Lambda deployment may have failed" >> $GITHUB_STEP_SUMMARY
          echo "3. **Test API**: Access health check at \`/health\` and predictions at \`/predict\`" >> $GITHUB_STEP_SUMMARY
          echo "4. **Scale**: Adjust replicas in the deployment manifest as needed" >> $GITHUB_STEP_SUMMARY
          echo "5. **Monitor**: Set up monitoring for the deployed API" >> $GITHUB_STEP_SUMMARY
        else
          echo "1. **Fix Issues**: Check logs and resolve build/deployment issues" >> $GITHUB_STEP_SUMMARY
          echo "2. **Retry**: Re-run the pipeline after fixes" >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Create Lambda execution role
      run: |
        echo "Creating Lambda execution role..."
        
        # Check if role already exists
        if aws iam get-role --role-name ChurnPredictionLambdaRole >/dev/null 2>&1; then
          echo "✅ Lambda role already exists"
        else
          # Create trust policy for Lambda
          cat > lambda-trust-policy.json << EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        }
        EOF
        
          # Create the role
          aws iam create-role \
            --role-name ChurnPredictionLambdaRole \
            --assume-role-policy-document file://lambda-trust-policy.json
            
          # Attach basic Lambda execution policy
          aws iam attach-role-policy \
            --role-name ChurnPredictionLambdaRole \
            --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
            
          # Attach ECR access policy
          aws iam attach-role-policy \
            --role-name ChurnPredictionLambdaRole \
            --policy-arn arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
            
          echo "✅ Lambda role created successfully"
        fi
        
        # Get role ARN
        LAMBDA_ROLE_ARN=$(aws iam get-role --role-name ChurnPredictionLambdaRole --query 'Role.Arn' --output text)
        echo "LAMBDA_ROLE_ARN=$LAMBDA_ROLE_ARN" >> $GITHUB_ENV
        
    - name: Deploy Lambda function
      run: |
        echo "Deploying Lambda function..."
        
        FUNCTION_NAME="churn-prediction-api"
        
        # Check if function already exists
        if aws lambda get-function --function-name $FUNCTION_NAME >/dev/null 2>&1; then
          echo "Updating existing Lambda function..."
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --image-uri ${{ env.IMAGE_URI }}
            
          # Update function configuration
          aws lambda update-function-configuration \
            --function-name $FUNCTION_NAME \
            --timeout 30 \
            --memory-size 1024 \
            --environment Variables='{
              "AWS_DEFAULT_REGION":"${{ secrets.AWS_DEFAULT_REGION }}",
              "MLFLOW_TRACKING_URI":"${{ secrets.MLFLOW_TRACKING_URI }}",
              "MODEL_STAGE":"Production"
            }'
            
          echo "✅ Lambda function updated successfully"
        else
          echo "Creating new Lambda function..."
          
          # Wait a bit for the role to be available
          sleep 10
          
          aws lambda create-function \
            --function-name $FUNCTION_NAME \
            --role ${{ env.LAMBDA_ROLE_ARN }} \
            --code ImageUri=${{ env.IMAGE_URI }} \
            --package-type Image \
            --timeout 30 \
            --memory-size 1024 \
            --environment Variables='{
              "AWS_DEFAULT_REGION":"${{ secrets.AWS_DEFAULT_REGION }}",
              "MLFLOW_TRACKING_URI":"${{ secrets.MLFLOW_TRACKING_URI }}",
              "MODEL_STAGE":"Production"
            }' \
            --description "Customer Churn Prediction API using MLflow model"
            
          echo "✅ Lambda function created successfully"
        fi
        
        # Get function ARN
        LAMBDA_FUNCTION_ARN=$(aws lambda get-function --function-name $FUNCTION_NAME --query 'Configuration.FunctionArn' --output text)
        echo "LAMBDA_FUNCTION_ARN=$LAMBDA_FUNCTION_ARN" >> $GITHUB_ENV
        echo "LAMBDA_FUNCTION_NAME=$FUNCTION_NAME" >> $GITHUB_ENV
        
    - name: Create API Gateway
      run: |
        echo "Setting up API Gateway for Lambda..."
        
        API_NAME="churn-prediction-api"
        
        # Check if API already exists
        API_ID=$(aws apigatewayv2 get-apis --query "Items[?Name=='$API_NAME'].ApiId" --output text)
        
        if [ "$API_ID" != "None" ] && [ ! -z "$API_ID" ]; then
          echo "✅ API Gateway already exists with ID: $API_ID"
        else
          echo "Creating new API Gateway..."
          
          # Create HTTP API
          API_RESULT=$(aws apigatewayv2 create-api \
            --name $API_NAME \
            --protocol-type HTTP \
            --description "Customer Churn Prediction API" \
            --cors-configuration AllowCredentials=false,AllowHeaders="Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token",AllowMethods="GET,POST,OPTIONS",AllowOrigins="*")
            
          API_ID=$(echo $API_RESULT | jq -r '.ApiId')
          echo "✅ API Gateway created with ID: $API_ID"
        fi
        
        echo "API_GATEWAY_ID=$API_ID" >> $GITHUB_ENV
        
        # Create Lambda integration
        INTEGRATION_RESULT=$(aws apigatewayv2 create-integration \
          --api-id $API_ID \
          --integration-type AWS_PROXY \
          --integration-uri ${{ env.LAMBDA_FUNCTION_ARN }} \
          --payload-format-version "2.0")
          
        INTEGRATION_ID=$(echo $INTEGRATION_RESULT | jq -r '.IntegrationId')
        echo "INTEGRATION_ID=$INTEGRATION_ID" >> $GITHUB_ENV
        
        # Create routes
        aws apigatewayv2 create-route \
          --api-id $API_ID \
          --route-key "GET /health" \
          --target integrations/$INTEGRATION_ID
          
        aws apigatewayv2 create-route \
          --api-id $API_ID \
          --route-key "POST /predict" \
          --target integrations/$INTEGRATION_ID
          
        aws apigatewayv2 create-route \
          --api-id $API_ID \
          --route-key "GET /" \
          --target integrations/$INTEGRATION_ID
          
        # Create deployment and stage
        DEPLOYMENT_RESULT=$(aws apigatewayv2 create-deployment --api-id $API_ID)
        DEPLOYMENT_ID=$(echo $DEPLOYMENT_RESULT | jq -r '.DeploymentId')
        
        # Create or update stage
        if aws apigatewayv2 get-stage --api-id $API_ID --stage-name prod >/dev/null 2>&1; then
          aws apigatewayv2 update-stage \
            --api-id $API_ID \
            --stage-name prod \
            --deployment-id $DEPLOYMENT_ID
        else
          aws apigatewayv2 create-stage \
            --api-id $API_ID \
            --stage-name prod \
            --deployment-id $DEPLOYMENT_ID \
            --auto-deploy
        fi
        
        # Get the API endpoint
        API_ENDPOINT="https://${API_ID}.execute-api.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com/prod"
        echo "API_ENDPOINT=$API_ENDPOINT" >> $GITHUB_ENV
        
        echo "✅ API Gateway configured successfully"
        echo "API Endpoint: $API_ENDPOINT"
        
    - name: Configure Lambda permissions for API Gateway
      run: |
        echo "Configuring Lambda permissions for API Gateway..."
        
        # Add permission for API Gateway to invoke Lambda
        aws lambda add-permission \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
          --statement-id api-gateway-invoke \
          --action lambda:InvokeFunction \
          --principal apigateway.amazonaws.com \
          --source-arn "arn:aws:execute-api:${{ secrets.AWS_DEFAULT_REGION }}:*:${{ env.API_GATEWAY_ID }}/*" \
          2>/dev/null || echo "Permission already exists"
          
        echo "✅ Lambda permissions configured"
        
    - name: Test Lambda deployment
      run: |
        echo "Testing Lambda deployment..."
        
        # Wait for deployment to be ready
        sleep 30
        
        # Test health endpoint
        echo "Testing health endpoint..."
        HEALTH_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/health_response.json "${{ env.API_ENDPOINT }}/health")
        
        if [ "$HEALTH_RESPONSE" = "200" ]; then
          echo "✅ Health check passed"
          cat /tmp/health_response.json
        else
          echo "⚠️ Health check returned status: $HEALTH_RESPONSE"
          cat /tmp/health_response.json || echo "No response body"
        fi
        
        # Test prediction endpoint with sample data
        echo "Testing prediction endpoint..."
        PREDICTION_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/prediction_response.json \
          -X POST "${{ env.API_ENDPOINT }}/predict" \
          -H "Content-Type: application/json" \
          -d '{
            "features": {
              "AMT_INCOME_TOTAL": 202500,
              "AMT_CREDIT": 406597.5,
              "AMT_ANNUITY": 24700.5,
              "AMT_GOODS_PRICE": 351000,
              "DAYS_BIRTH": -9461,
              "DAYS_EMPLOYED": -637,
              "REGION_POPULATION_RELATIVE": 0.018801,
              "DAYS_ID_PUBLISH": -2120,
              "OWN_CAR_AGE": 12,
              "FLAG_MOBIL": 1,
              "FLAG_EMP_PHONE": 1,
              "FLAG_WORK_PHONE": 0,
              "FLAG_CONT_MOBILE": 1,
              "FLAG_PHONE": 1,
              "FLAG_EMAIL": 0,
              "CNT_FAM_MEMBERS": 2,
              "REGION_RATING_CLIENT": 2,
              "REGION_RATING_CLIENT_W_CITY": 2,
              "HOUR_APPR_PROCESS_START": 10,
              "REG_REGION_NOT_LIVE_REGION": 0,
              "REG_REGION_NOT_WORK_REGION": 0,
              "LIVE_REGION_NOT_WORK_REGION": 0,
              "REG_CITY_NOT_LIVE_CITY": 0,
              "REG_CITY_NOT_WORK_CITY": 0,
              "LIVE_CITY_NOT_WORK_CITY": 0
            }
          }')
        
        if [ "$PREDICTION_RESPONSE" = "200" ]; then
          echo "✅ Prediction test passed"
          cat /tmp/prediction_response.json
        else
          echo "⚠️ Prediction test returned status: $PREDICTION_RESPONSE"
          cat /tmp/prediction_response.json || echo "No response body"
        fi
        
    - name: Update deployment artifacts with Lambda info
      run: |
        # Update deployment info with Lambda details
        cat > lambda-deployment-info.json << EOF
        {
          "deployment_id": "${{ github.run_id }}",
          "lambda_function_arn": "${{ env.LAMBDA_FUNCTION_ARN }}",
          "lambda_function_name": "${{ env.LAMBDA_FUNCTION_NAME }}",
          "api_gateway_id": "${{ env.API_GATEWAY_ID }}",
          "api_endpoint": "${{ env.API_ENDPOINT }}",
          "lambda_role_arn": "${{ env.LAMBDA_ROLE_ARN }}",
          "image_uri": "${{ env.IMAGE_URI }}",
          "git_commit": "${{ env.COMMIT_SHA }}",
          "branch": "${{ env.BRANCH_NAME_RAW }}",
          "build_date": "${{ env.BUILD_DATE }}",
          "endpoints": {
            "health": "${{ env.API_ENDPOINT }}/health",
            "predict": "${{ env.API_ENDPOINT }}/predict",
            "root": "${{ env.API_ENDPOINT }}/"
          },
          "lambda_configuration": {
            "timeout": 30,
            "memory_size": 1024,
            "package_type": "Image"
          }
        }
        EOF
        
        echo "✅ Lambda deployment info created"
        
    - name: Cleanup temporary files
      if: always()
      run: |
        echo "Cleaning up temporary files..."
        rm -f *.txt *.csv *.pkl lambda-trust-policy.json /tmp/health_response.json /tmp/prediction_response.json 2>/dev/null || true
        echo "✅ Cleanup completed" 